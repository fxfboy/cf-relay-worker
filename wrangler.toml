name = "cf-relay-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 自定义域名:绑定为 Custom Domain(该域名的 zone 需在同一 Cloudflare 账户)。
# 出于隐私,仓库不写入真实域名。部署时二选一:
#   A) 在 Cloudflare Dashboard → Workers → 本 Worker → Settings → Domains & Routes
#      → Add Custom Domain 添加你自己的域名(无需改本文件);
#   B) 取消下面注释,把 clip.example.com 换成你自己的域名后再 `npm run deploy`。
#      custom_domain 的 pattern 是整个主机名(不含路径);Worker 内部再按 /ws 路由。
# [[routes]]
# pattern = "clip.example.com"
# custom_domain = true

# 单条收到的 WebSocket 文本消息字节上限（十进制）。
# 与代码默认值相同：33554432（32 MiB），对齐 Durable Objects 入站 WebSocket 上限
# https://developers.cloudflare.com/durable-objects/platform/limits/ （2026-11-07，仅限制收到的消息）。
# 可调低。大于 33554432 会在运行时被钳到该平台上限。空值或非正整数会回退到 33554432。
[vars]
MAX_MESSAGE_BYTES = "33554432"

# invocation_logs 会记录请求头(含 Sec-WebSocket-Protocol / X-Relay-Room),
# 其中带有房间 id,因此关闭。应用日志里也不要打印这些字段。
[observability.logs]
enabled = true
invocation_logs = false
